<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Plugin Manager</title>
  
  <!-- Local CodeMirror Assets -->
  <link rel="stylesheet" href="lib/codemirror.min.css">
  <link rel="stylesheet" href="lib/dracula.min.css">
  <link rel="stylesheet" href="lib/lint.css">
  <link rel="stylesheet" href="lib/foldgutter.css">
  <link rel="stylesheet" href="lib/dialog.css">

  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1f2937;
      display: flex;
      height: 100vh;
      background: #f3f4f6;
    }

    /* Left Sidebar */
    .sidebar {
      width: 280px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 { margin: 0; font-size: 16px; }
    .plugin-list {
      list-style: none;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      flex: 1;
    }
    .plugin-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .plugin-item:hover { background: #f3f4f6; }
    .plugin-item.selected {
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 600;
    }
    .plugin-item-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .plugin-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .plugin-item-id {
      font-size: 11px;
      color: #6b7280;
      font-family: monospace;
    }
    .dot-active { color: #10b981; }
    .dot-inactive { color: #9ca3af; }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
    }
    .sidebar-footer button {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
    }

    /* Right Editor Area */
    .editor-pane {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      max-width: 1050px;
    }
	
	.editor-pane-row {
      gap: 16px;
      padding: 16px 0px;
      overflow-y: hidden;
      display: flex;
      flex-direction: row;
      max-width: 1050px;
	}
	
    .top-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 6px;
    }
    .id-badge {
      font-size: 12px;
      color: #6b7280;
      font-family: monospace;
      margin-bottom: 16px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      width: fit-content;
    }
    .field-group { margin-bottom: 16px; }

    /* CodeMirror Styling */
    .CodeMirror {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    #jsWrapper .CodeMirror { height: 320px; }
    #cssWrapper .CodeMirror { height: 160px; }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      padding-bottom: 24px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-secondary { background: #e5e7eb; color: #1f2937; }
    .btn-secondary:hover { background: #d1d5db; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger { background: #ef4444; color: #fff; margin-left: auto; }
    .btn-danger:hover { background: #dc2626; }
    .status {
      font-size: 13px;
      color: #059669;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .status.show { opacity: 1; }
  </style>
  

	
</head>
<body>

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Plugins</h2>
      <span id="statusMsgSidebar" class="status">Saved!</span>
      <button id="newBtn" class="btn-secondary">+ New</button>
    </div>
    <ul id="pluginList" class="plugin-list"></ul>
    
    <!-- Backup Controls -->
    <div class="sidebar-footer">
      <button id="exportBtn" class="btn-secondary">Export JSON</button>
      <button id="importBtn" class="btn-secondary">Import JSON</button>
      <input type="file" id="importFileInput" accept=".json" style="display: none;">
    </div>
  </aside>

  <!-- Right Main Editor -->
  <main class="editor-pane">
    <div class="top-bar">
      <input type="text" id="pluginName" placeholder="Plugin Name (e.g., ServiceNow Quick Copy)">
    </div>
	
	<div class="id-badge">ID: <span id="pluginIdDisplay">-</span></div>
	<div class="editor-pane-row">
		<label class="checkbox-label">
		  <input type="checkbox" id="activeFlag"> Active
		</label>

		<label class="checkbox-label">
		  <input type="checkbox" id="libraryFlag"> Library
		</label>
	</div>
	
    <div class="field-group">
      <label for="matchPattern">Match Pattern</label>
      <input type="text" id="matchPattern" placeholder="e.g., service-now.com">
		<div class="id-badge">
			<span id="match_help">
			Split by comma for OR groups, and '+' for AND conditions within a group<br/>
			Example: "service-now.com + incident.do, service-now.com + problem.do"
			</span>
		</div>
    </div>
	


    <div class="field-group" id="jsWrapper">
      <label>JavaScript Code</label>
      <textarea id="codeEditor"></textarea>
    </div>

    <div class="field-group" id="cssWrapper">
      <label>CSS</label>
      <textarea id="cssEditor"></textarea>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn-primary">Save</button>
	  <button id="exportSingleBtn" class="btn-secondary">Export</button>
      <span id="statusMsg" class="status">Saved!</span>
      <button id="deleteBtn" class="btn-danger">Delete</button>
    </div>
  </main>

  <!-- Local CodeMirror Scripts -->
  <script src="lib/codemirror.min.js"></script>
  <script src="lib/javascript.min.js"></script>
  <script src="lib/css.min.js"></script>
  <script src="lib/matchbrackets.js"></script>
  <script src="lib/closebrackets.js"></script>
  
  <!-- Linting Dependencies (order matters) -->
  <script src="lib/jshint.js"></script>
  <script src="lib/lint.js"></script>
  <script src="lib/javascript-lint.js"></script>
  
  <script src="lib/foldcode.js"></script>
  <script src="lib/foldgutter.js"></script>
  <script src="lib/brace-fold.js"></script>
  <script src="lib/comment-fold.js"></script>
  
  <script src="lib/search.js"</script>
  <script src="lib/searchcursor.js"</script>
  <script src="lib/dialog.js"></script>
  
  <script src="lib/beautify.js"></script>
  <script src="options.js"></script>

</body>
</html>
