<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 14px;
      background: #f9fafb;
      color: #1f2937;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      margin-bottom: 12px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <label class="toggle-row">
    <input type="checkbox" id="extensionActive"> Extension Active
  </label>
  <button id="manageBtn">Manage Plugins</button>

  <script src="popup.js"></script>
</body>
</html>
